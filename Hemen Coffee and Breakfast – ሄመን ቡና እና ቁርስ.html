main{padding-bottom:48px}

.dh h2{font-size:1.35rem}

.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.qty{display:flex;align-items:center;gap:8px}

.df{padding:14px 20px;border-top:1px solid var(--line);background:var(--card);overflow-y:auto;max-height:62vh}
.df label.l,.df .l{display:block;font-weight:500;margin:0 0 6px}

.pay{display:grid;gap:6px;margin-bottom:8px}

.go{width:100%;height:48px;border:0;border-radius:24px;background:var(--head);color:#FBF3E4;font-weight:700}

rTitle:"የዕለት የትዕዛዝ ሪፖርት",pinQ:"ሪፖርቱን ለማየት የአስተዳዳሪ መግቢያ ያስገቡ።",email:"ኢሜይል",pass:"የይለፍ ቃል",unlock:"ግባ",bad:"ኢሜይሉ ወይም የይለፍ ቃሉ ልክ አይደለም። እንደገና ይሞክሩ።",date:"ቀን",orders:"ትዕዛዞች",rev:"ገቢ",brk:"የክፍያ ዝርዝር",hist:"የትዕዛዝ ታሪክ",noO:"በዚህ ቀን ትዕዛዝ የለም።",lock:"ውጣ",clear:"ሁሉንም ትዕዛዝ አጥፋ",sure:"በዚህ መሣሪያ ላይ የተቀመጡ ትዕዛዞች በሙሉ ይጥፉ?",dev:"ትዕዛዞች የሚቀመጡት በዚህ መሣሪያ አሳሽ ላይ ብቻ ነው።",tbl:"ጠረጴዛ",etb:"ብር"}};
const CATS=["coffee","iced","breakfast","pastries"];
const M=[
["coffee","Espresso","ኤስፕሬሶ","Double shot, rich crema.","ጠንካራ ድርብ ሾት።",60,"☕"],
["coffee","Macchiato","ማኪያቶ","Espresso with a spoon of milk foam.","ኤስፕሬሶ ከትንሽ ወተት አረፋ ጋር።",75,"☕"],
["coffee","Cappuccino","ካፑቺኖ","Espresso, milk and velvety foam.","ኤስፕሬሶ፣ ወተትና ለስላሳ አረፋ።",95,"☕"],
["coffee","Jebena Buna","የጀበና ቡና","Fresh coffee brewed in a clay jebena.","በባህላዊ ጀበና የተፈላ ትኩስ ቡና።",70,"🫖"],
["iced","Iced Latte","አይስ ላቴ","Espresso over cold milk and ice.","ኤስፕሬሶ ከቀዝቃዛ ወተትና በረዶ ጋር።",110,"🧊"],
["iced","Caramel Cold Brew","ካራሜል ኮልድ ብሩ","Steeped 18 hours, caramel drizzle.","18 ሰዓት የተነከረ፣ በካራሜል።",125,"🥤"],
["iced","Fresh Mango Juice","ትኩስ የማንጎ ጭማቂ","Ripe mango, blended thick.","የበሰለ ማንጎ፣ ወፍራም ጭማቂ።",90,"🥭"],
["iced","Iced Chocolate","አይስ ቸኮሌት","Dark cocoa, milk and ice.","ጥቁር ቸኮሌት፣ ወተትና በረዶ።",105,"🍫"],
["breakfast","Ful Medames","ፉል","Slow-cooked fava beans with bread.","በዘይት የተሰራ ባቄላ ከዳቦ ጋር።",150,"🫘"],
["breakfast","Firfir","ፍርፍር","Injera in spiced berbere sauce.","እንጀራ በበርበሬ ወጥ የተፈተፈተ።",160,"🍲"],
["breakfast","Scrambled Eggs","የተፈተፈተ እንቁላል","Three eggs, toast and tomato.","ሦስት እንቁላል፣ ቶስትና ቲማቲም።",140,"🍳"],
["breakfast","Honey Pancakes","የማር ፓንኬክ","Three pancakes, butter and honey.","ሦስት ፓንኬክ ከቅቤና ማር ጋር።",130,"🥞"],
["pastries","Butter Croissant","ክሮሳንት","Flaky, baked every morning.","በየጠዋቱ የሚጋገር ቅቤ ክሮሳንት።",70,"🥐"],
["pastries","Cinnamon Roll","ቀረፋ ሮል","Soft roll with caramel glaze.","ለስላሳ ሮል በካራሜል ብርጭቆ።",85,"🥮"],
["pastries","Chocolate Muffin","ቸኮሌት ማፊን","Double chocolate, moist crumb.","ድርብ ቸኮሌት ለስላሳ ማፊን።",75,"🧁"],
["pastries","Banana Bread","የሙዝ ዳቦ","Warm slice with a hint of nutmeg.","ትኩስ ቁራጭ በትንሽ ቅመም።",80,"🍞"]
].map((r,i)=>({id:i,cat:r[0],n:[r[1],r[2]],d:[r[3],r[4]],p:r[5],e:r[6]}));

const $=id=>document.getElementById(id);
const mem={};
const S={get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let lang=S.get("hemen_lang","en"),cat="all",term="",pay="cash",unlocked=false,rdate="";
const cart=new Map();let shotData="";let voiceOn=true;
const T=k=>TX[lang][k]||k, L=()=>lang==="am"?1:0;
const etb=n=>n.toLocaleString("en-US")+" "+T("etb");
const dkey=ts=>new Date(ts).toLocaleDateString("en-CA");
const hm=ts=>new Date(ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const orders=()=>S.get("hemen_orders",[]);
const PAYN=()=>({cash:T("cash"),telebirr:T("telebirr"),cbe:T("cbe")});

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=T(e.dataset.ph));
  $("lang").textContent=lang==="en"?"አማርኛ":"English";
  $("tel").textContent="📞 "+CFG.phoneShow;$("tel").href="tel:"+CFG.phone;
  tabs();menu();cartR();payR();if(!$("reportView").classList.contains("hide"))report();
}
function tabs(){$("tabs").innerHTML=["all",...CATS].map(c=>`<button class="tab" role="tab" aria-selected="${c===cat}" data-c="${c}">${T(c)}</button>`).join("")}
function menu(){
  const t=term.trim().toLowerCase();
  const l=M.filter(m=>(cat==="all"||m.cat===cat)&&(!t||(m.n.join(" ")+" "+m.d.join(" ")).toLowerCase().includes(t)));
  if(!l.length){$("list").innerHTML=`<div class="empty">${T("none")}</div>`;return}
  $("list").innerHTML=CATS.map(c=>{const it=l.filter(m=>m.cat===c);if(!it.length)return"";
    return `<section class="sec">${cat==="all"?`<h3>${T(c)}</h3>`:'<div style="height:16px"></div>'}<div class="grid">${it.map(m=>`<article class="card"><div class="ph" aria-hidden="true">${m.e}</div><div class="body"><h4>${m.n[L()]}</h4><p>${m.d[L()]}</p><div class="row"><span class="price">${etb(m.p)}</span><button class="add" data-id="${m.id}">${T("add")}</button></div></div></article>`).join("")}</div></section>`}).join("");
}
function sum(){let n=0,c=0;cart.forEach((q,id)=>{n+=q*M[id].p;c+=q});return[n,c]}
function cartR(){
  const[n,c]=sum();$("count").textContent=c;$("total").textContent=etb(n);
  $("items").innerHTML=cart.size?[...cart].map(([id,q])=>{const m=M[id];return `<div class="it"><span class="e">${m.e}</span><div class="n"><b>${m.n[L()]}</b><span>${etb(m.p)} ${T("each")}</span></div><div class="qty"><button data-d="-1" data-id="${id}" aria-label="−">−</button><b>${q}</b><button data-d="1" data-id="${id}" aria-label="+">+</button></div></div>`}).join(""):`<div class="empty">${T("emptyCart")}</div>`;
}
function payInfo(p){return p==="cash"?T("cashN"):`${T("payN")}<br>${p==="telebirr"?T("mer")+": <code>"+CFG.telebirr+"</code>":T("acc")+": <code>"+CFG.cbe+"</code>"}`}
function payR(){
  $("pay").innerHTML=["cash","telebirr","cbe"].map(p=>`<label class="po"><input type="radio" name="pay" value="${p}" ${p===pay?"checked":""}>${PAYN()[p]}</label>`).join("");
  $("pd").className="pd pd";$("pd").innerHTML=payInfo(pay);$("shot").classList.toggle("hide",pay==="cash");
}
function drawer(on){
  $("drawer").classList.toggle("on",on);$("ov").classList.toggle("on",on);$("drawer").setAttribute("aria-hidden",!on);
  if(on){showCart();cartR();$("close").focus()}
}
function showCart(){$("cartPane").classList.remove("hide");$("ticketPane").classList.add("hide")}

function sndR(){$("snd").textContent=voiceOn?"🔊":"🔇";$("snd").setAttribute("aria-pressed",voiceOn)}
function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),t=a.currentTime;[784,1047].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t+i*.18;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.4);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.45)})}catch(e){}}
function say(x){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const am=lang==="am"&&speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith("am")),u=new SpeechSynthesisUtterance(am?x[1]:x[0]);u.lang=am?"am-ET":"en-US";speechSynthesis.speak(u)}catch(e){}}
function announce(num,t,n){if(!voiceOn)return;chime();say([`Order ${num} received for table ${t}. Total ${n} birr.`,`ትዕዛዝ ቁጥር ${num} ተቀብለናል። ጠረጴዛ ${t}። ጠቅላላ ${n} ብር።`])}
function report(){
  const R=$("report");
  if(!unlocked){R.innerHTML=`<h2>${T("rTitle")}</h2><p>${T("pinQ")}</p><div class="login"><label>${T("email")}<input type="email" id="em" autocomplete="username"></label><label>${T("pass")}<input type="password" id="pin" autocomplete="current-password"></label><button class="btn p" id="unl">${T("unlock")}</button></div><p class="err" id="perr" role="alert"></p>`;
    const go=()=>{if($("em").value.trim().toLowerCase()===CFG.adminEmail&&$("pin").value===CFG.adminPass){unlocked=true;report()}else $("perr").textContent=T("bad")};
    $("unl").onclick=go;[$("em"),$("pin")].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()});return}
  rdate=rdate||dkey(Date.now());
  const day=orders().filter(o=>dkey(o.ts)===rdate).sort((a,b)=>b.ts-a.ts);
  const rev=day.reduce((s,o)=>s+o.total,0);
  const by={cash:[0,0],telebirr:[0,0],cbe:[0,0]};day.forEach(o=>{by[o.pay][0]++;by[o.pay][1]+=o.total});
  R.innerHTML=`<h2>${T("rTitle")}</h2><div class="bar2"><label>${T("date")} <input type="date" id="rd" value="${rdate}"></label><button class="btn" id="lk">${T("lock")}</button></div>
  <div class="stats"><div class="stat"><span>${T("orders")}</span><b>${day.length}</b></div><div class="stat"><span>${T("rev")}</span><b>${etb(rev)}</b></div></div>
  <h3>${T("brk")}</h3><div class="brk">${Object.keys(by).map(p=>`<div class="br"><div><span>${PAYN()[p]} · ${by[p][0]}</span><b>${etb(by[p][1])}</b></div><div class="meter"><i style="width:${rev?Math.round(by[p][1]/rev*100):0}%"></i></div></div>`).join("")}</div>
  <h3 style="margin-top:22px">${T("hist")}</h3><div class="hist">${day.length?day.map(o=>`<div class="ho"><div><b>#${String(o.n).padStart(3,"0")} · ${hm(o.ts)} · ${T("tbl")} ${o.table}</b><b>${etb(o.total)}</b></div><div><small>${o.items.map(i=>i.q+" × "+M[i.id].n[L()]).join(", ")}</small><small>${PAYN()[o.pay]}</small></div>${o.shot?`<img src="${o.shot}" alt="${T("shot")}">`:""}</div>`).join(""):`<p class="empty">${T("noO")}</p>`}</div>
  <p class="note" style="margin-top:18px">${T("dev")}</p><button class="btn" id="clr">${T("clear")}</button>`;
  $("rd").onchange=e=>{rdate=e.target.value||dkey(Date.now());report()};
  $("lk").onclick=()=>{unlocked=false;report()};
  $("clr").onclick=()=>{if(confirm(T("sure"))){S.set("hemen_orders",[]);report()}};
}
function route(){
  const rep=location.hash==="#report";
  $("menuView").classList.toggle("hide",rep);$("reportView").classList.toggle("hide",!rep);
  $("tabs").classList.toggle("hide",rep);
  if(rep){report();window.scrollTo(0,0)}
}
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){cat=b.dataset.c;tabs();menu()}};
$("q").oninput=e=>{term=e.target.value;if(location.hash==="#report")location.hash="#menu";menu()};
$("list").onclick=e=>{const b=e.target.closest(".add");if(!b)return;const id=+b.dataset.id;cart.set(id,(cart.get(id)||0)+1);cartR();b.textContent=T("added");setTimeout(()=>b.textContent=T("add"),900)};
$("items").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;const id=+b.dataset.id,q=(cart.get(id)||0)+ +b.dataset.d;q<=0?cart.delete(id):cart.set(id,q);cartR()};
$("pay").onchange=e=>{pay=e.target.value;$("pd").innerHTML=payInfo(pay);$("shot").classList.toggle("hide",pay==="cash")};
$("file").onchange=e=>{const f=e.target.files[0];shotData="";$("prev").classList.add("hide");if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,720/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);shotData=c.toDataURL("image/jpeg",.6);$("prev").src=shotData;$("prev").classList.remove("hide");$("err").textContent="";URL.revokeObjectURL(u)};im.onerror=()=>{$("err").textContent=T("shotBad")};im.src=u};
$("lang").onclick=()=>{lang=lang==="en"?"am":"en";S.set("hemen_lang",lang);applyLang()};
$("open").onclick=()=>drawer(true);$("close").onclick=$("close2").onclick=$("ov").onclick=()=>drawer(false);
document.onkeydown=e=>{if(e.key==="Escape")drawer(false)};
window.onhashchange=route;
$("send").onclick=()=>{
  const t=$("table").value.trim();
  if(!cart.size){$("err").textContent=T("errEmpty");return}
  if(!/^\d{1,3}$/.test(t)){$("err").textContent=T("errTable");$("table").focus();return}
  if(pay!=="cash"&&!shotData){$("err").textContent=T("errShot");return}
  $("err").textContent="";
  const[n]=sum(),ts=Date.now(),all=orders(),num=all.filter(o=>dkey(o.ts)===dkey(ts)).length+1;
  const o={ts,n:num,table:t,pay,total:n,shot:pay==="cash"?"":shotData,items:[...cart].map(([id,q])=>({id,q,p:M[id].p}))};
  all.push(o);const saved=S.set("hemen_orders",all);
  $("ticket").innerHTML=`<div class="paper"><h3>${T("tbl")} ${t}</h3><span class="chip">#${String(num).padStart(3,"0")}</span><span class="chip">${PAYN()[pay]}</span><p style="margin:0 0 8px;color:var(--mute)">${T("at")} ${hm(ts)}</p><ul>${o.items.map(i=>`<li><span>${i.q} × ${M[i.id].n[L()]}</span><span>${etb(i.q*i.p)}</span></li>`).join("")}</ul><div class="tot"><span>${T("total")}</span><span>${etb(n)}</span></div><p class="pd" style="margin:0">${payInfo(pay)}</p>${o.shot?`<img src="${o.shot}" alt="${T("shot")}" style="max-width:100%;border-radius:10px;margin-top:10px">`:""}<p style="margin:10px 0 0">${T("show")}</p>${saved?"":`<p class="err">${T("full")}</p>`}</div><button class="ghost" id="nw">${T("newO")}</button>`;
  $("cartPane").classList.add("hide");$("ticketPane").classList.remove("hide");announce(num,t,n);
  $("nw").onclick=()=>{cart.clear();$("table").value="";shotData="";$("file").value="";$("prev").classList.add("hide");cartR();drawer(false)};
};
$("snd").onclick=()=>{voiceOn=!voiceOn;S.set("hemen_voice",voiceOn);sndR();if(voiceOn)chime()};
voiceOn=S.get("hemen_voice",true);
applyLang();route();sndR();
</script>
</body>
